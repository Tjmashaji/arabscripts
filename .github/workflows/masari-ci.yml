# فحوصات مساري التلقائية مع كل دفع أو طلب دمج يمس مجلد masari:
# فحص الكود والأنواع، اختبارات الوحدة، بناء الموقع، واختبار دخان في متصفح حقيقي لكل دور.
name: masari-ci

on:
  push:
    paths: ["masari/**", ".github/workflows/masari-ci.yml"]
  pull_request:
    paths: ["masari/**", ".github/workflows/masari-ci.yml"]

defaults:
  run:
    working-directory: masari

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: masari/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (Vercel SPA)
        run: npm run build:spa
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test (all roles, mocked backend)
        run: |
          npx vite preview --config vite.spa.config.ts --port 4173 --host 127.0.0.1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          npm run test:smoke

  # قاعدة البيانات: تُطبّق كل الترحيلات على Postgres 16 محلي ثم تُشغَّل اختبارات supabase/tests
  # (العزل بين المدارس والأدوار، رفع الصلاحيات، اعتماد المحطات، إنهاء الرحلة). لا تلمس Supabase الحقيقي.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Database tests (RLS and trip rules)
        run: bash supabase/tests/local/run.sh

  # تطبيق أندرويد (للسائقين: موقع الباص يستمر والشاشة مطفأة). يُنزَّل الملف من صفحة التشغيل في GitHub Actions.
  android-apk:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: masari/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Android SDK مثبت مسبقًا على ubuntu-latest (ANDROID_HOME)؛ نقبل التراخيص فقط
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - name: Build web app and copy into Android
        run: npm run android:sync
      - name: Build APK
        working-directory: masari/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: masari-android
          path: masari/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
