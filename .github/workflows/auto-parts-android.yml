# يبني تطبيق أندرويد (Capacitor) من auto-parts/mobile ويرفع ملف APK للتجربة في Artifacts التشغيل.
# التطبيق يفتح المنصة المنشورة، فلا يلزم إعادة بنائه مع كل تحديث للموقع؛ فقط عند تغيير الغلاف (الأيقونات، الإعدادات، الإضافات).
name: auto-parts-android

on:
  push:
    paths:
      - "auto-parts/mobile/**"
      - ".github/workflows/auto-parts-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: auto-parts/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auto-parts/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # إعداد Firebase للإشعارات (Settings ← Secrets ← GOOGLE_SERVICES_JSON). بدونه تُبنى النسخة بلا إشعارات.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi
      - run: npx cap sync android && node scripts/push-flag.mjs
      - name: Build debug APK
        working-directory: auto-parts/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: auto-parts-android-debug
          path: auto-parts/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
